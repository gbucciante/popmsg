[package]
name = "popmsg"
version = "2.2.1"
description = "Messaggistica LAN compatibile con IP Messenger"
edition = "2024"

[dependencies]
fltk = { version = "1.5", default-features = false, features = ["no-pango"] }
rsa = "0.9"
aes = "0.8"
ctr = "0.9"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
rand = "0.8"
png = "0.17"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
hex = "0.4"
encoding_rs = "0.8"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
gethostname = "0.5"
whoami = { version = "1", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.21", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
