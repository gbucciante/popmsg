name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: POPMSG-windows
          - os: macos-latest
            artifact: POPMSG-macos
          - os: ubuntu-22.04
            artifact: POPMSG-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev \
            libxrender-dev libxfixes-dev libfontconfig1-dev libdbus-1-dev pkg-config
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Impacchetta
        shell: bash
        run: |
          mkdir out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/popmsg.exe out/POPMSG.exe
            (cd out && 7z a ../${{ matrix.artifact }}.zip POPMSG.exe)
          elif [ "$RUNNER_OS" = "macOS" ]; then
            APP=out/POPMSG.app/Contents
            mkdir -p $APP/MacOS $APP/Resources
            cp target/release/popmsg $APP/MacOS/POPMSG
            mkdir icon.iconset
            for s in 16 32 64 128 256; do sips -z $s $s assets/popmsg.png --out icon.iconset/icon_${s}x${s}.png >/dev/null; done
            iconutil -c icns icon.iconset -o $APP/Resources/POPMSG.icns
            cat > $APP/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>POPMSG</string>
            <key>CFBundleExecutable</key><string>POPMSG</string>
            <key>CFBundleIdentifier</key><string>app.popmsg.POPMSG</string>
            <key>CFBundleIconFile</key><string>POPMSG</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>2.0.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
            (cd out && ditto -c -k --keepParent POPMSG.app ../${{ matrix.artifact }}.zip)
          else
            cp target/release/popmsg out/POPMSG
            tar czf ${{ matrix.artifact }}.tar.gz -C out POPMSG
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.*
